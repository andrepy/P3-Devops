name: Pipeline Biblioteca API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Testar Aplicação
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Subir ambiente com Docker Compose
        run:
          cp .env.example .env
          docker compose up -d --build

      - name: Aguardar API ficar pronta
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health && exit 0
            echo "Tentativa $i/30..."
            sleep 2
          done
          exit 1

      - name: Health Check
        run: |
          STATUS=$(curl -s -o health.json -w "%{http_code}" http://localhost:3000/health)
          [ "$STATUS" = "200" ] || exit 1
          grep -q '"status":"ok"' health.json

      - name: Derrubar ambiente
        if: always()
        run: docker compose down -v

  build:
    name: Build e push de imagem
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN  }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/biblioteca-api:latest 
            ${{ secrets.DOCKERHUB_USERNAME }}/biblioteca-api:${{ github.sha }}


      
